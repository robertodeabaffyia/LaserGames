<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 88" width="220" height="88">
  <!-- Background -->
  <rect width="220" height="88" rx="6" fill="#0d0d0d"/>

  <!-- "laser" — top line -->
  <text
    x="12" y="44"
    font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif"
    font-size="38"
    font-weight="900"
    fill="#ffffff"
    letter-spacing="-1"
    transform="skewX(-6)"
  >laser</text>

  <!-- "games" — bottom line, slightly indented right -->
  <text
    x="22" y="78"
    font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif"
    font-size="38"
    font-weight="900"
    fill="#ffffff"
    letter-spacing="-1"
    transform="skewX(-6)"
  >games</text>

  <!-- Red diagonal slash -->
  <line
    x1="6"  y1="58"
    x2="214" y2="50"
    stroke="#cc1111"
    stroke-width="2.5"
    stroke-linecap="round"
  />
</svg>
